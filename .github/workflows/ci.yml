# Kiểm tra tự động mỗi lần push / mở pull request. Không đăng gì ra ngoài: repo private vẫn kín.
# Chạy trên máy của GitHub (miễn phí 2.000 phút/tháng cho repo private; mỗi lần chạy ~2 phút).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - run: python -m pytest -q

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/run-viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/run-viewer/.nvmrc
          cache: npm
          cache-dependency-path: ui/run-viewer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Bản build tải về được từ tab Actions (chỉ người có quyền vào repo mới thấy), giữ 14 ngày
      - uses: actions/upload-artifact@v4
        with:
          name: run-viewer-dist
          path: ui/run-viewer/dist
          retention-days: 14
