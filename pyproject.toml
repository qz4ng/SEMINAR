[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ra_causal"
version = "0.1.0"
description = "Causal inference preprocessing pipeline for cover cropping yield estimation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<3.0",
    "numpy>=1.24,<3.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "pydantic>=2.5,<3.0",
    "scikit-learn>=1.3"
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-cov"
]

[project.scripts]
run_pipeline = "ra_causal.cli.run_pipeline:main"
run_step = "ra_causal.cli.run_step:main"

[tool.setuptools.packages.find]
where = ["src"]

