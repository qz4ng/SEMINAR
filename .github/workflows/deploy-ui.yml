# Build giao diện ui/run-viewer và đăng lên GitHub Pages mỗi khi push lên main.
# Bật một lần: GitHub → Settings → Pages → Source: "GitHub Actions".
name: Deploy Run Viewer

on:
  push:
    branches: [main]
    paths: ["ui/run-viewer/**", ".github/workflows/deploy-ui.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/run-viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/run-viewer/.nvmrc
          cache: npm
          cache-dependency-path: ui/run-viewer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/run-viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
